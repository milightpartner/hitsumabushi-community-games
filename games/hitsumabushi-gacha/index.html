<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ひつまぶしガチャ</title>
  <style>
    :root {
      --bg: #0a0b10;
      --card: rgba(22, 26, 42, 0.92);
      --accent: #00f0ff;
      --accent2: #ff007f;
      --gold: #ffd700;
      --lime: #39ff14;
      --muted: #94a3b8;
      --r0: #e2e8f0;
      --r1: #38bdf8;
      --r2: #ff3b5c;
      --r3: #ffd700;
      --r4: #ff7af5;
      --rainbow: linear-gradient(90deg, #ff004c, #ff9a00, #ffe600, #39ff14, #00f0ff, #7a5cff, #ff00d4, #ff004c);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      overscroll-behavior: none;
      overflow: hidden;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      height: 100dvh;
      padding: 12px;
      transition: background-color 0.3s;
    }
    body.transparent { background-color: transparent !important; }

    .game-card {
      position: relative;
      z-index: 1;
      background: var(--card);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
      padding: 18px;
      width: 100%;
      max-width: 560px;
      max-height: 100%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: center;
    }
    .game-card.shake { animation: cardShake 0.5s; }
    @keyframes cardShake {
      0%, 100% { transform: translate(0, 0); }
      15% { transform: translate(-8px, 4px); }
      30% { transform: translate(7px, -5px); }
      45% { transform: translate(-6px, -3px); }
      60% { transform: translate(5px, 5px); }
      75% { transform: translate(-3px, 2px); }
    }

    /* 観戦者向け表示。観戦中はゲーム操作エリアのタップ・クリックを無効化する */
    .spectator-badge {
      display: none;
      align-self: center;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 230, 0, 0.12);
      border: 1px solid var(--gold);
      color: var(--gold);
      font-size: 0.85rem;
    }
    body.spectating .spectator-badge { display: inline-block; }
    body.spectating .play-area { pointer-events: none; opacity: 0.85; }

    .title-row { display: flex; align-items: center; justify-content: center; gap: 8px; position: relative; }
    .title-text { font-size: clamp(1.2rem, 4.5vw, 1.6rem); font-weight: 900; }
    .title {
      background: var(--rainbow);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: slideX 4s linear infinite;
    }
    .sound-btn {
      position: absolute;
      right: 0;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      width: 36px;
      height: 32px;
      cursor: pointer;
    }
    .subtitle { font-size: 0.8rem; color: var(--muted); line-height: 1.5; }
    .subtitle strong { color: #fff; }

    .rate-list { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .rate {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--c);
      color: var(--c);
      background: rgba(255, 255, 255, 0.03);
    }
    .rate.r4 { border-color: var(--r4); }
    .rate .rate-pt { color: #fff; font-weight: 700; }

    .player-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .player-chip {
      --pc: #00f0ff;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 6px 10px;
      min-width: 100px;
      font-size: 0.72rem;
      transition: box-shadow 0.2s, border-color 0.2s;
    }
    .player-chip.current { border-color: var(--pc); box-shadow: 0 0 14px var(--pc); }
    .player-chip.done { opacity: 0.8; }
    .player-chip .chip-name { display: block; color: var(--pc); font-weight: 700; }
    .player-chip .chip-points { display: block; font-size: 1.05rem; font-weight: 800; margin-top: 2px; }
    .player-chip .chip-sub { display: block; color: var(--muted); margin-top: 2px; }
    .dots { display: inline-flex; gap: 6px; margin-top: 2px; }
    .dot { display: inline-flex; align-items: center; gap: 2px; }
    .dot::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--c);
      box-shadow: 0 0 6px var(--c);
    }
    .dot.r4::before { background: var(--rainbow); }

    .turn-banner { font-size: 0.95rem; min-height: 1.4em; }
    .turn-banner strong { color: var(--gold); }

    /* ガチャの演出エリア。タップで演出をスキップできる */
    .stage {
      position: relative;
      height: 232px;
      flex-shrink: 0;
      border-radius: 16px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 45%, rgba(0, 240, 255, 0.08), rgba(0, 0, 0, 0.35) 70%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }
    .stage-idle { color: var(--muted); font-size: 0.85rem; line-height: 1.6; }
    .stage-idle .big-emoji { font-size: 3rem; display: block; animation: bob 2s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .skip-hint { position: absolute; right: 10px; bottom: 6px; font-size: 0.65rem; color: rgba(255, 255, 255, 0.35); }

    .rays {
      position: absolute;
      width: 420px;
      height: 420px;
      left: 50%;
      top: 50%;
      margin: -210px 0 0 -210px;
      background: repeating-conic-gradient(from 0deg, var(--c, #fff) 0deg 8deg, transparent 8deg 24deg);
      -webkit-mask: radial-gradient(circle, #000 10%, transparent 65%);
      mask: radial-gradient(circle, #000 10%, transparent 65%);
      opacity: 0.12;
      animation: spin 6s linear infinite;
      transition: opacity 0.3s;
    }
    .rays.r4 { background: repeating-conic-gradient(from 0deg, #ff004c 0deg 8deg, transparent 8deg 16deg, #ffe600 16deg 24deg, transparent 24deg 32deg, #00f0ff 32deg 40deg, transparent 40deg 48deg); animation-duration: 2s; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .orb-wrap { position: relative; }
    .orb-wrap.shake { animation: orbShake 0.12s infinite; }
    @keyframes orbShake {
      0%, 100% { transform: translate(0, 0) rotate(0); }
      25% { transform: translate(-3px, 1px) rotate(-4deg); }
      75% { transform: translate(3px, -1px) rotate(4deg); }
    }
    .orb {
      --c: #e2e8f0;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff 0%, var(--c) 40%, rgba(0, 0, 0, 0.6) 100%);
      box-shadow: 0 0 30px var(--c), 0 0 70px var(--c);
      transition: background 0.25s, box-shadow 0.25s;
    }
    .orb.rainbow { animation: hue 0.8s linear infinite; }
    .orb.burst { animation: orbBurst 0.35s ease-out forwards; }
    @keyframes orbBurst { to { transform: scale(3); opacity: 0; } }
    @keyframes hue { to { filter: hue-rotate(360deg); } }
    .stage-caption { position: absolute; bottom: 14px; font-size: 0.8rem; color: var(--muted); letter-spacing: 2px; }
    .promo-text {
      position: absolute;
      top: 18px;
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--gold);
      text-shadow: 0 0 12px var(--gold);
      animation: popText 0.6s ease-out;
    }

    .gc {
      --c: var(--r0);
      position: relative;
      border-radius: 10px;
      border: 2px solid var(--c);
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.1), rgba(0, 0, 0, 0.35));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      animation: flipIn 0.3s ease-out;
    }
    .gc.r1, .gc.r2, .gc.r3 { box-shadow: 0 0 12px var(--c); }
    .gc.r4 {
      border-color: transparent;
      background: linear-gradient(#171b2b, #171b2b) padding-box, var(--rainbow) border-box;
      background-size: 100% 100%, 200% 100%;
      box-shadow: 0 0 18px #ff7af5, 0 0 36px #00f0ff;
      animation: flipIn 0.3s ease-out, slide 1.2s linear infinite;
    }
    @keyframes slide { to { background-position: 0 0, 200% 0; } }
    @keyframes slideX { to { background-position: 200% 0; } }
    @keyframes flipIn {
      from { transform: rotateY(90deg) scale(0.8); opacity: 0; }
      to { transform: rotateY(0) scale(1); opacity: 1; }
    }
    .gc .em { line-height: 1; display: inline-flex; }
    .gc .em img, .rate-icon img { display: block; width: 1.25em; height: 1.25em; object-fit: contain; }
    .rate-icon { display: inline-flex; font-size: 1em; }
    /* 虹：ひつまぶしのロゴの上に虹色を流して重ねる */
    .rainbow-icon {
      position: relative;
      display: inline-block;
      border-radius: 22%;
      overflow: hidden;
      filter: drop-shadow(0 0 6px #ff7af5) drop-shadow(0 0 10px #00f0ff);
    }
    .rainbow-icon img { display: block; }
    .rainbow-icon::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #ff004c, #ff9a00, #ffe600, #39ff14, #00f0ff, #7a5cff, #ff00d4, #ff004c, #ff9a00, #ffe600);
      background-size: 200% 200%;
      mix-blend-mode: color;
      opacity: 0.8;
      animation: rainbowShift 2.4s linear infinite;
    }
    @keyframes rainbowShift { to { background-position: 200% 200%; } }
    .gc.big .em img { width: 1.6em; height: 1.6em; }
    .gc .nm { color: var(--c); font-weight: 800; }
    .gc.r4 .nm {
      background: var(--rainbow);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .gc .it { font-size: 0.8rem; color: #fff; }
    .gc .pt { font-size: 0.75rem; color: var(--muted); }
    .gc.big { width: 132px; height: 176px; }
    .gc.big .em { font-size: 3.2rem; }
    .gc.big .nm { font-size: 1.3rem; }
    .gc.sm { width: 60px; height: 82px; }
    .gc.sm .em { font-size: 1.6rem; }
    .gc.sm .nm { font-size: 0.8rem; }
    .gc.sm .pt { font-size: 0.65rem; }

    .multi-grid { display: grid; grid-template-columns: repeat(5, 60px); gap: 8px; }
    .tile-grid { display: grid; grid-template-columns: repeat(10, 16px); gap: 3px; }
    .tile {
      --c: var(--r0);
      width: 16px;
      height: 16px;
      border-radius: 4px;
      background: var(--c);
      animation: tileIn 0.2s ease-out;
    }
    .tile.r0 { background: rgba(226, 232, 240, 0.22); }
    .tile.r2, .tile.r3 { box-shadow: 0 0 8px var(--c); }
    .tile.r4 { background: var(--rainbow); background-size: 300% 100%; box-shadow: 0 0 10px #ff7af5; animation: tileIn 0.2s ease-out, slideX 1s linear infinite; }
    @keyframes tileIn { from { transform: scale(0); } to { transform: scale(1); } }
    .pull-summary { font-size: 0.85rem; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
    .pull-summary .total { color: var(--gold); font-weight: 800; font-size: 1rem; }

    .play-area { display: flex; flex-direction: column; gap: 8px; align-items: center; }
    .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .pull-btn {
      min-width: 104px;
      min-height: 50px;
      padding: 10px 18px;
      border-radius: 14px;
      border: none;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      background: var(--accent);
      color: #0a0b10;
      transition: transform 0.15s, opacity 0.15s;
    }
    .pull-btn.ten { background: var(--accent2); color: #fff; }
    .pull-btn.all {
      background: var(--rainbow);
      background-size: 200% 100%;
      color: #0a0b10;
      animation: slideX 3s linear infinite;
    }
    .pull-btn:active { transform: scale(0.95); }
    .pull-btn:disabled { opacity: 0.35; cursor: not-allowed; animation: none; }
    .pull-btn[hidden] { display: none; }
    .hint { font-size: 0.75rem; color: var(--muted); min-height: 1.2em; }

    .leaderboard-panel { display: none; flex-direction: column; gap: 8px; }
    .leaderboard-panel.show { display: flex; }
    .leaderboard-title { font-size: 1rem; color: var(--gold); }
    .result-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      font-size: 0.85rem;
    }
    .result-row.winner { border: 1px solid var(--gold); box-shadow: 0 0 14px rgba(255, 215, 0, 0.35); }
    .result-row .rank { width: 1.6em; }
    .result-row .name { flex: 1; text-align: left; }
    .result-row .points { color: var(--gold); font-weight: 800; min-width: 4em; text-align: right; }
    .finish-btn {
      align-self: center;
      margin-top: 4px;
      min-width: 140px;
      min-height: 46px;
      border-radius: 14px;
      border: none;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      background: var(--accent);
      color: #0a0b10;
    }
    .finish-btn[hidden] { display: none; }
    .finish-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* 画面全体の演出（フラッシュ・虹の背景・確定の文字・紙吹雪） */
    .fx-layer { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
    .flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 40; }
    .flash.go { animation: flash 0.45s ease-out; }
    @keyframes flash { from { opacity: 0.85; } to { opacity: 0; } }
    .rainbow-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      opacity: 0;
      background: var(--rainbow);
      background-size: 400% 400%;
      transition: opacity 0.4s;
      pointer-events: none;
    }
    .rainbow-bg.on { opacity: 0.45; animation: slideX 2s linear infinite; }
    .big-text {
      position: fixed;
      left: 50%;
      top: 42%;
      transform: translate(-50%, -50%);
      font-size: clamp(2.2rem, 11vw, 4.8rem);
      font-weight: 900;
      white-space: nowrap;
      z-index: 60;
      pointer-events: none;
      opacity: 0;
      -webkit-text-stroke: 2px rgba(0, 0, 0, 0.5);
    }
    .big-text.go { animation: bigText 1.3s ease-out forwards; }
    .big-text.r3 { color: var(--gold); text-shadow: 0 0 24px var(--gold), 0 0 48px #ff9a00; }
    .big-text.r4 {
      background: var(--rainbow);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 18px #ff7af5);
    }
    @keyframes bigText {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(3); }
      20% { opacity: 1; transform: translate(-50%, -50%) scale(0.9); }
      30% { transform: translate(-50%, -50%) scale(1.05); }
      80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.1); }
    }
    @keyframes popText {
      0% { transform: scale(2.5); opacity: 0; }
      60% { transform: scale(0.9); opacity: 1; }
      100% { transform: scale(1); }
    }
    .particle {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--c);
      box-shadow: 0 0 8px var(--c);
      animation: particle 0.9s ease-out forwards;
    }
    @keyframes particle {
      from { transform: translate(0, 0) scale(1); opacity: 1; }
      to { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
    }
    .confetti {
      position: absolute;
      top: -20px;
      width: 8px;
      height: 14px;
      background: var(--c);
      animation: confetti var(--t) linear forwards;
    }
    @keyframes confetti {
      to { transform: translate(var(--dx), 110vh) rotate(var(--rot)); }
    }

    @media (prefers-reduced-motion: reduce) {
      .game-card.shake, .orb-wrap.shake { animation: none; }
    }
  </style>
</head>
<body>
  <div class="rainbow-bg" id="rainbowBg"></div>
  <div class="flash" id="flash"></div>
  <div class="big-text" id="bigText"></div>
  <div class="fx-layer" id="fxLayer"></div>

  <div class="game-card" id="gameCard">
    <div class="spectator-badge">👀 観戦中</div>
    <div class="title-row">
      <h2 class="title-text"><span class="title-icon">🎰</span> <span class="title">ひつまぶしガチャ</span></h2>
      <button class="sound-btn" id="soundBtn" title="効果音のオン・オフ">🔊</button>
    </div>
    <p class="subtitle">
      順番に1人<strong>100回</strong>ガチャを引きます。単発・10連・100連は自由に組み合わせOK。<br>
      全員が引き終わったら、<strong>合計ポイント</strong>が一番高い人の勝ち！
    </p>
    <div class="rate-list" id="rateList"></div>

    <div class="player-list" id="playerList"></div>
    <div class="turn-banner" id="turnBanner"></div>

    <div class="stage" id="stage"></div>

    <!-- 操作可能なUIは .play-area の中に置く（観戦時に自動でロックされる） -->
    <div class="play-area" id="playArea">
      <div class="btn-row">
        <button class="pull-btn" id="pull1">単発</button>
        <button class="pull-btn ten" id="pull10">10連</button>
        <button class="pull-btn all" id="pullAll">100連</button>
      </div>
      <div class="hint" id="hint"></div>
    </div>

    <div class="leaderboard-panel" id="leaderboardPanel">
      <div class="leaderboard-title">🏆 リザルト</div>
      <div id="leaderboard"></div>
      <button class="finish-btn" id="finishBtn" hidden>終了</button>
      <div class="hint" id="finishHint"></div>
    </div>
  </div>

  <!--
    ひつまぶしSDKを公開URLから読み込む。グローバルの `Hitsumabushi` として利用できる。
    URLの版を固定しているので、SDKが更新されてもこのゲームの動きは変わらない。
    SDKを更新するときは、URLの版の部分を書き換える。
  -->
  <script src="https://milightpartner.jp/sdk/0.20.0/hitsumabushi-sdk.js"></script>
  <script>
    const PULLS_PER_PLAYER = 100;
    const HEARTBEAT_MS = 3000;
    // 手番の人が操作しないまま、この時間が経ったら、ホストが残りをまとめて引く（離脱で止まらないように）
    const TURN_TIMEOUT_MS = 30000;
    // 誰も「終了」を押さなかったときに、ホストが自動で結果を報告するまでの時間
    const AUTO_FINISH_MS = 30000;
    const CPU_THINK_MS = 1000;

    // レア度。確率は 400 分の何回か（白は残り全部）
    const RARITIES = [
      { name: '白', item: 'ごはん', emoji: '🍚', pts: 1, odds: 347, color: '#e2e8f0' },
      { name: '青', item: '薬味', emoji: '🌿', pts: 3, odds: 40, color: '#38bdf8' },
      { name: '赤', item: 'お出汁', emoji: '🍵', pts: 5, odds: 8, color: '#ff3b5c' },
      { name: '金', item: 'うなぎ', icon: 'assets/unagi-gold.svg', pts: 7, odds: 4, color: '#ffd700' },
      { name: '虹', item: '特上ひつまぶし', icon: 'assets/hitsumabushi.png', rainbow: true, pts: 10, odds: 1, color: '#ff7af5' },
    ];
    const ODDS_TOTAL = 400;
    const RATE_LABELS = ['', '1/10', '1/50', '1/100', '1/400'];
    const CONFETTI_COLORS = ['#ff004c', '#ff9a00', '#ffe600', '#39ff14', '#00f0ff', '#7a5cff', '#ff00d4'];

    let myPlayerId = 'p1';
    let isSpectator = false;
    let players = [];
    let gameMasterId = null;

    // 試合の状態。ホストだけが書き換え、STATE で全員に配る。
    // pulls は引いた結果の履歴。p は order の何番目の人か（IDより短く、送る量を抑えるため）、
    // r はレア度（0〜4）を1文字ずつ並べた文字列、a は時間切れで自動で引いたか
    let state = null;
    let receivedState = false;
    // 演出を再生し終えた pulls の数。表示（点数・手番）はここまでの結果で出す
    let shownCount = 0;
    let animating = false;
    let matchToken = 0;
    let pendingPull = false;
    let finishRequested = false;
    let leaderboardShown = false;
    let reported = false;

    let heartbeatTimer = null;
    let cpuTimer = null;
    let turnTimer = null;
    let autoFinishTimer = null;
    let pendingTimer = null;

    const els = {
      gameCard: document.getElementById('gameCard'),
      rateList: document.getElementById('rateList'),
      playerList: document.getElementById('playerList'),
      turnBanner: document.getElementById('turnBanner'),
      stage: document.getElementById('stage'),
      pull1: document.getElementById('pull1'),
      pull10: document.getElementById('pull10'),
      pullAll: document.getElementById('pullAll'),
      hint: document.getElementById('hint'),
      leaderboardPanel: document.getElementById('leaderboardPanel'),
      leaderboard: document.getElementById('leaderboard'),
      finishBtn: document.getElementById('finishBtn'),
      finishHint: document.getElementById('finishHint'),
      soundBtn: document.getElementById('soundBtn'),
      rainbowBg: document.getElementById('rainbowBg'),
      flash: document.getElementById('flash'),
      bigText: document.getElementById('bigText'),
      fxLayer: document.getElementById('fxLayer'),
    };

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    // ---------- 効果音（WebAudio で合成。音源ファイルは使わない） ----------

    let soundOn = true;
    try { soundOn = localStorage.getItem('hitsumabushi-gacha-sound') !== 'off'; } catch (e) { /* 保存できない環境では毎回オン */ }
    let audioCtx = null;

    function ensureAudio() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
      }
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    }
    document.addEventListener('pointerdown', ensureAudio);

    function tone(freq, dur, { type = 'sine', gain = 0.07, delay = 0, slideTo = null } = {}) {
      if (!soundOn || !audioCtx || audioCtx.state !== 'running') return;
      const t0 = audioCtx.currentTime + delay;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      g.gain.setValueAtTime(gain, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g).connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    }

    const sfx = {
      charge() { tone(180, 0.8, { type: 'sawtooth', gain: 0.04, slideTo: 900 }); },
      promo() { tone(500, 0.25, { type: 'square', gain: 0.05, slideTo: 1400 }); },
      tick(r) {
        if (r === 0) { tone(880, 0.05, { gain: 0.03 }); return; }
        this.reveal(Math.min(r, 2));
      },
      reveal(r) {
        const chords = [
          [660],
          [523, 784],
          [523, 659, 784],
          [523, 659, 784, 1047, 1319],
          [392, 523, 659, 784, 1047, 1319, 1568, 2093],
        ];
        chords[r].forEach((f, i) => tone(f, 0.25 + r * 0.12, { type: r >= 3 ? 'triangle' : 'sine', delay: i * (r >= 3 ? 0.07 : 0.03), gain: 0.06 }));
      },
      confirm(r) {
        [0, 0.12, 0.24].forEach((d, i) => tone(r === 4 ? 784 + i * 262 : 659 + i * 196, 0.3, { type: 'square', gain: 0.05, delay: d }));
      },
    };

    function renderSoundBtn() { els.soundBtn.textContent = soundOn ? '🔊' : '🔇'; }
    els.soundBtn.addEventListener('click', () => {
      soundOn = !soundOn;
      try { localStorage.setItem('hitsumabushi-gacha-sound', soundOn ? 'on' : 'off'); } catch (e) { /* 保存できなくても切り替えは効く */ }
      renderSoundBtn();
    });

    // ---------- 待ち時間（タップで演出をスキップできるようにする） ----------

    let skipping = false;
    let sleepers = [];

    function sleep(ms) {
      if (skipping || ms <= 0) return Promise.resolve();
      return new Promise((resolve) => {
        const entry = { resolve };
        entry.timer = setTimeout(() => {
          sleepers = sleepers.filter((s) => s !== entry);
          resolve();
        }, ms);
        sleepers.push(entry);
      });
    }

    function skipNow() {
      skipping = true;
      sleepers.forEach((s) => { clearTimeout(s.timer); s.resolve(); });
      sleepers = [];
    }

    // スキップ中は、音や画面全体の演出を出さない（結果の表示だけ一気に進める）
    function fx(fn) { if (!skipping) fn(); }

    els.stage.addEventListener('click', () => { if (animating) skipNow(); });

    // ---------- 画面全体の演出 ----------

    function flashScreen() {
      els.flash.classList.remove('go');
      void els.flash.offsetWidth;
      els.flash.classList.add('go');
    }

    function shakeCard() {
      els.gameCard.classList.remove('shake');
      void els.gameCard.offsetWidth;
      els.gameCard.classList.add('shake');
    }

    function showBigText(text, r) {
      els.bigText.textContent = text;
      els.bigText.className = `big-text r${r}`;
      void els.bigText.offsetWidth;
      els.bigText.classList.add('go');
    }

    function setRainbowBg(on) { els.rainbowBg.classList.toggle('on', on); }

    function burstAt(el, r, count) {
      const rect = el.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      for (let i = 0; i < count; i++) {
        const p = document.createElement('span');
        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.4;
        const dist = 60 + Math.random() * (60 + r * 30);
        const color = r === 4 ? CONFETTI_COLORS[i % CONFETTI_COLORS.length] : RARITIES[r].color;
        p.className = 'particle';
        p.style.cssText = `left:${cx}px;top:${cy}px;--c:${color};--dx:${Math.cos(angle) * dist}px;--dy:${Math.sin(angle) * dist}px`;
        els.fxLayer.appendChild(p);
        setTimeout(() => p.remove(), 1000);
      }
    }

    function confetti(count) {
      for (let i = 0; i < count; i++) {
        const c = document.createElement('span');
        const t = 1.6 + Math.random() * 1.6;
        c.className = 'confetti';
        c.style.cssText = `left:${Math.random() * 100}%;--c:${CONFETTI_COLORS[i % CONFETTI_COLORS.length]};--t:${t}s;--dx:${(Math.random() - 0.5) * 160}px;--rot:${Math.random() * 1080 - 540}deg;animation-delay:${Math.random() * 0.4}s`;
        els.fxLayer.appendChild(c);
        setTimeout(() => c.remove(), (t + 0.5) * 1000);
      }
    }

    function vibrate(r) {
      try { if (navigator.vibrate) navigator.vibrate(r === 4 ? [80, 60, 80, 60, 200] : [60, 40, 60]); } catch (e) { /* 振動できない端末では何もしない */ }
    }

    // ---------- 試合の状態から分かること ----------

    function summarize(pulls) {
      const sum = {};
      players.forEach((p) => { sum[p.id] = { pulled: 0, counts: [0, 0, 0, 0, 0], points: 0 }; });
      pulls.forEach((pull) => {
        const s = sum[state.order[pull.p]];
        if (!s) return;
        for (const ch of pull.r) {
          const r = Number(ch);
          s.pulled++;
          s.counts[r]++;
          s.points += RARITIES[r].pts;
        }
      });
      return sum;
    }

    // 手番の人：順番が先で、まだ100回引き終えていない人
    function currentPlayerId(sum) {
      if (!state) return null;
      return state.order.find((id) => sum[id] && sum[id].pulled < PULLS_PER_PLAYER) || null;
    }

    function isOver(sum) { return !!state && state.order.length > 0 && currentPlayerId(sum) === null; }

    function isCpuId(playerId) {
      const p = players.find((pl) => pl.id === playerId);
      return !!(p && p.isCpu);
    }

    function playerById(id) { return players.find((p) => p.id === id); }

    function nameHtml(id) {
      const p = playerById(id);
      if (!p) return '?';
      return `<span style="color:${p.color || '#00f0ff'};font-weight:700">${escapeHtml(p.name)}</span>${id === myPlayerId ? '（あなた）' : ''}${p.isCpu ? ' 🤖' : ''}`;
    }

    // 1回に引ける回数：単発、10連（残り10回以上）、残り全部（最初は100連）
    function isAllowedCount(count, remaining) {
      if (remaining <= 0) return false;
      return count === 1 || (count === 10 && remaining >= 10) || count === remaining;
    }

    function pullLabel(count, auto) {
      if (auto) return `残り${count}連（時間切れ）`;
      if (count === 1) return '単発';
      return `${count}連`;
    }

    // ---------- 描画 ----------

    function renderRates() {
      els.rateList.innerHTML = RARITIES.map((r, i) => {
        const rate = i === 0 ? '' : ` ${RATE_LABELS[i]}`;
        return `<span class="rate r${i}" style="--c:${r.color}"><span class="rate-icon">${iconHtml(i)}</span> ${r.name}${rate} <span class="rate-pt">${r.pts}pt</span></span>`;
      }).join('');
    }

    function countDots(counts) {
      return [1, 2, 3, 4].map((r) => `<span class="dot r${r}" style="--c:${RARITIES[r].color}">${counts[r]}</span>`).join('');
    }

    function renderBoard() {
      if (!state) {
        els.playerList.innerHTML = '';
        return;
      }
      const sum = summarize(state.pulls.slice(0, shownCount));
      const cur = animating ? null : currentPlayerId(sum);
      els.playerList.innerHTML = state.order.map((id) => {
        const p = playerById(id);
        if (!p) return '';
        const s = sum[id];
        const remaining = PULLS_PER_PLAYER - s.pulled;
        const cls = id === cur ? 'current' : remaining === 0 ? 'done' : '';
        return `<div class="player-chip ${cls}" style="--pc:${p.color || '#00f0ff'}">
          <span class="chip-name">${escapeHtml(p.name)}${id === myPlayerId ? '（あなた）' : ''}${p.isCpu ? ' 🤖' : ''}</span>
          <span class="chip-points">${s.points}pt</span>
          <span class="chip-sub">${remaining === 0 ? '引き終わり' : `残り${remaining}回`}</span>
          <span class="dots">${countDots(s.counts)}</span>
        </div>`;
      }).join('');
      // リザルトを出したあとは、見出しに勝敗を出したままにする
      if (!animating && !leaderboardShown) {
        if (cur === null) {
          els.turnBanner.textContent = '全員が100回引き終わりました！';
        } else if (cur === myPlayerId) {
          els.turnBanner.innerHTML = `<strong>あなたのターン！</strong>（残り${PULLS_PER_PLAYER - sum[cur].pulled}回）`;
        } else {
          els.turnBanner.innerHTML = `${nameHtml(cur)} のターン（残り${PULLS_PER_PLAYER - sum[cur].pulled}回）`;
        }
      }
    }

    function renderIdleStage() {
      els.stage.innerHTML = `<div class="stage-idle"><span class="big-emoji">🎰</span>ボタンを押してガチャを回そう！</div>`;
    }

    function updateControls() {
      const sum = state ? summarize(state.pulls) : null;
      const cur = sum ? currentPlayerId(sum) : null;
      const remaining = cur ? PULLS_PER_PLAYER - sum[cur].pulled : 0;
      const myTurn = !isSpectator && cur === myPlayerId && !animating && !pendingPull;

      els.pull1.disabled = !myTurn;
      els.pull10.disabled = !myTurn || remaining < 10;
      // 「残り全部」のボタン。最初は100連、途中からは残りの回数を表示する（10連と同じになるときは出さない）
      const showAll = cur !== myPlayerId || (remaining > 1 && remaining !== 10);
      els.pullAll.hidden = !showAll;
      els.pullAll.disabled = !myTurn;
      els.pullAll.textContent = cur === myPlayerId && remaining < PULLS_PER_PLAYER ? `残り${remaining}連` : '100連';

      if (isSpectator || animating) {
        els.hint.textContent = '';
      } else if (cur === myPlayerId && !animating) {
        els.hint.textContent = `${TURN_TIMEOUT_MS / 1000}秒操作がないと、残りを自動で引きます`;
      } else if (cur && cur !== myPlayerId) {
        els.hint.textContent = 'ほかの人のガチャを見守ろう';
      } else {
        els.hint.textContent = '';
      }
    }

    // アイテムの絵。金・虹は画像（虹はひつまぶしのロゴに虹色を重ねる）、それ以外は絵文字
    function iconHtml(r) {
      const rr = RARITIES[r];
      if (!rr.icon) return rr.emoji;
      const img = `<img src="${rr.icon}" alt="${rr.item}" draggable="false">`;
      return rr.rainbow ? `<span class="rainbow-icon">${img}</span>` : img;
    }

    function cardHtml(r, size) {
      const rr = RARITIES[r];
      const item = size === 'big' ? `<span class="it">${rr.item}</span>` : '';
      return `<div class="gc ${size} r${r}" style="--c:${rr.color}"><span class="em">${iconHtml(r)}</span><span class="nm">${rr.name}</span>${item}<span class="pt">+${rr.pts}pt</span></div>`;
    }

    function summaryHtml(items) {
      const counts = [0, 0, 0, 0, 0];
      let pts = 0;
      items.forEach((r) => { counts[r]++; pts += RARITIES[r].pts; });
      return `<div class="pull-summary"><span class="dots">${countDots(counts)}</span><span class="total">+${pts}pt</span></div>`;
    }

    // ---------- ガチャの演出 ----------

    function setOrb(orb, rays, r) {
      orb.style.setProperty('--c', RARITIES[r].color);
      orb.classList.toggle('rainbow', r === 4);
      rays.style.setProperty('--c', RARITIES[r].color);
      rays.classList.toggle('r4', r === 4);
      rays.style.opacity = [0.12, 0.3, 0.5, 0.8, 1][r];
    }

    // 玉が光ってから割れるまで。玉の色で一番いいレア度を予告する。赤以上はときどき「昇格」する
    async function charge(best, index, token) {
      els.stage.innerHTML = `<div class="rays"></div><div class="orb-wrap shake"><div class="orb"></div></div><div class="stage-caption">ガチャ回転中…</div>`;
      const rays = els.stage.querySelector('.rays');
      const orb = els.stage.querySelector('.orb');
      setOrb(orb, rays, 0);
      fx(() => sfx.charge());
      await sleep(700);
      if (token !== matchToken) return;

      // 昇格するかどうかは pulls の番号から決める（全員の画面で同じ演出になるように）
      const promote = best >= 2 && (index * 7 + best * 3) % 5 < 2;
      if (promote) {
        setOrb(orb, rays, 1 + (index % (best - 1)));
        await sleep(650);
        if (token !== matchToken) return;
        fx(() => {
          flashScreen();
          sfx.promo();
          els.stage.insertAdjacentHTML('beforeend', '<div class="promo-text">昇格!!</div>');
        });
      }
      setOrb(orb, rays, best);
      await sleep(best >= 1 ? 500 : 200);
      if (token !== matchToken) return;

      if (best >= 3) {
        fx(() => {
          showBigText(best === 4 ? '虹 確定!!!' : '金 確定!!', best);
          sfx.confirm(best);
          shakeCard();
          if (best === 4) setRainbowBg(true);
        });
        await sleep(best === 4 ? 1300 : 900);
        if (token !== matchToken) return;
      }

      orb.parentElement.classList.remove('shake');
      orb.classList.add('burst');
      fx(() => {
        if (best >= 2) flashScreen();
        burstAt(orb, best, 10 + best * 8);
      });
      await sleep(300);
    }

    async function revealSingle(r, isMine) {
      els.stage.innerHTML = `<div class="rays"></div>${cardHtml(r, 'big')}`;
      const rays = els.stage.querySelector('.rays');
      rays.style.setProperty('--c', RARITIES[r].color);
      rays.classList.toggle('r4', r === 4);
      rays.style.opacity = [0.12, 0.3, 0.5, 0.8, 1][r];
      fx(() => {
        sfx.reveal(r);
        burstAt(els.stage.querySelector('.gc'), r, 12 + r * 10);
        if (r >= 3) shakeCard();
        if (r === 4) confetti(90);
        if (isMine && r >= 3) vibrate(r);
      });
    }

    async function revealMulti(items, isMine, token) {
      els.stage.innerHTML = `<div class="multi-grid"></div><div class="summary-slot"></div>`;
      const grid = els.stage.querySelector('.multi-grid');
      for (const r of items) {
        grid.insertAdjacentHTML('beforeend', cardHtml(r, 'sm'));
        const el = grid.lastElementChild;
        fx(() => {
          sfx.tick(r);
          if (r >= 2) burstAt(el, r, 6 + r * 6);
          if (r >= 3) shakeCard();
          if (r === 4) confetti(70);
          if (isMine && r >= 3) vibrate(r);
        });
        await sleep([130, 160, 260, 500, 1000][r]);
        if (token !== matchToken) return;
      }
      els.stage.querySelector('.summary-slot').outerHTML = summaryHtml(items);
    }

    async function revealMany(items, isMine, token) {
      els.stage.innerHTML = `<div class="tile-grid"></div><div class="summary-slot"></div>`;
      const grid = els.stage.querySelector('.tile-grid');
      for (let i = 0; i < items.length; i++) {
        const r = items[i];
        const tile = document.createElement('div');
        tile.className = `tile r${r}`;
        tile.style.setProperty('--c', RARITIES[r].color);
        grid.appendChild(tile);
        fx(() => {
          if (r >= 2) sfx.tick(r);
          else if (i % 4 === 0) sfx.tick(0);
          if (r >= 2) burstAt(tile, r, 6 + r * 6);
          if (r >= 3) shakeCard();
          if (r === 4) confetti(70);
          if (isMine && r >= 3) vibrate(r);
        });
        await sleep([22, 22, 90, 380, 1000][r]);
        if (token !== matchToken) return;
      }
      els.stage.querySelector('.summary-slot').outerHTML = summaryHtml(items);
    }

    async function playPull(pull, index, fast) {
      const token = matchToken;
      skipping = fast;
      const items = [...pull.r].map(Number);
      const best = Math.max(...items);
      const pullerId = state.order[pull.p];
      const isMine = pullerId === myPlayerId;
      els.turnBanner.innerHTML = `${nameHtml(pullerId)} の <strong>${pullLabel(items.length, pull.a)}</strong>！`;

      await charge(best, index, token);
      if (token !== matchToken) return;
      if (items.length === 1) await revealSingle(items[0], isMine);
      else if (items.length <= 10) await revealMulti(items, isMine, token);
      else await revealMany(items, isMine, token);
      if (token !== matchToken) return;

      // スキップしても、結果は少しのあいだ見せる
      skipping = false;
      const hold = items.length === 1 ? [900, 1000, 1100, 1500, 2200][best] : items.length <= 10 ? 1100 : 1600;
      await sleep(fast ? 400 : hold + (items.length > 1 && best >= 3 ? 700 : 0));
      if (token !== matchToken) return;
      setRainbowBg(false);
    }

    // 届いた結果の演出を順番に再生する。たまっているときは、最後の1つ以外は短く流す
    async function pump() {
      if (animating) return;
      animating = true;
      const token = matchToken;
      updateControls();
      while (state && shownCount < state.pulls.length) {
        const index = shownCount;
        const backlog = state.pulls.length - index - 1;
        await playPull(state.pulls[index], index, backlog > 0);
        if (token !== matchToken) return;
        shownCount = index + 1;
        renderBoard();
      }
      animating = false;
      onIdle();
    }

    function onIdle() {
      renderBoard();
      updateControls();
      const sum = summarize(state.pulls);
      if (isOver(sum)) {
        showLeaderboard();
        return;
      }
      if (Hitsumabushi.isGameMaster()) {
        scheduleCpu();
        armTurnTimer();
      }
    }

    // ---------- ホスト（試合の進行役）の処理 ----------

    function randomIndex(n) {
      if (window.crypto && window.crypto.getRandomValues) {
        return window.crypto.getRandomValues(new Uint32Array(1))[0] % n;
      }
      return Math.floor(Math.random() * n);
    }

    function rollOne() {
      let n = randomIndex(ODDS_TOTAL);
      for (let r = RARITIES.length - 1; r >= 1; r--) {
        if (n < RARITIES[r].odds) return r;
        n -= RARITIES[r].odds;
      }
      return 0;
    }

    function broadcastState() {
      if (reported) return;
      Hitsumabushi.sendGameData({ type: 'STATE', state });
    }

    // ガチャを引く。手番の人の分だけ、許された回数だけ受け付ける
    function hostPull(playerId, count, auto) {
      if (!state || reported) return;
      const sum = summarize(state.pulls);
      if (currentPlayerId(sum) !== playerId) return;
      const remaining = PULLS_PER_PLAYER - sum[playerId].pulled;
      if (!isAllowedCount(count, remaining)) return;

      let r = '';
      for (let i = 0; i < count; i++) r += rollOne();
      const p = state.order.indexOf(playerId);
      state.pulls.push(auto ? { p, r, a: 1 } : { p, r });
      clearTimeout(turnTimer);
      turnTimer = null;
      broadcastState();
      pump();
    }

    function scheduleCpu() {
      if (cpuTimer || animating) return;
      const sum = summarize(state.pulls);
      const cur = currentPlayerId(sum);
      if (!cur || !isCpuId(cur)) return;
      const remaining = PULLS_PER_PLAYER - sum[cur].pulled;
      // 最初は半々で100連か10連。そのあとは10連ずつ、端数はまとめて引く
      let count;
      if (remaining === PULLS_PER_PLAYER) count = Math.random() < 0.5 ? PULLS_PER_PLAYER : 10;
      else count = remaining >= 10 ? 10 : remaining;
      cpuTimer = setTimeout(() => {
        cpuTimer = null;
        hostPull(cur, count, false);
      }, CPU_THINK_MS);
    }

    function armTurnTimer() {
      clearTimeout(turnTimer);
      turnTimer = null;
      const sum = summarize(state.pulls);
      const cur = currentPlayerId(sum);
      if (!cur || isCpuId(cur)) return;
      turnTimer = setTimeout(() => {
        turnTimer = null;
        const now = summarize(state.pulls);
        if (currentPlayerId(now) !== cur || animating) return;
        hostPull(cur, PULLS_PER_PLAYER - now[cur].pulled, true);
      }, TURN_TIMEOUT_MS);
    }

    function startHeartbeat() {
      heartbeatTimer = setInterval(() => {
        if (reported) {
          clearInterval(heartbeatTimer);
          heartbeatTimer = null;
          return;
        }
        broadcastState();
      }, HEARTBEAT_MS);
    }

    // ---------- 操作 ----------

    function requestPull(count) {
      if (isSpectator || animating || !state) return;
      const sum = summarize(state.pulls);
      if (currentPlayerId(sum) !== myPlayerId) return;
      const remaining = PULLS_PER_PLAYER - sum[myPlayerId].pulled;
      if (!isAllowedCount(count, remaining)) return;
      ensureAudio();
      if (Hitsumabushi.isGameMaster()) {
        hostPull(myPlayerId, count, false);
        return;
      }
      // ホストからの結果を待つあいだはボタンを押せなくする（届かなければ数秒で戻す）
      pendingPull = true;
      clearTimeout(pendingTimer);
      pendingTimer = setTimeout(() => { pendingPull = false; updateControls(); }, 5000);
      updateControls();
      Hitsumabushi.sendGameData({ type: 'PULL', count });
    }

    function remainingForMe() {
      if (!state) return 0;
      const sum = summarize(state.pulls);
      return PULLS_PER_PLAYER - sum[myPlayerId].pulled;
    }

    els.pull1.addEventListener('click', () => requestPull(1));
    els.pull10.addEventListener('click', () => requestPull(10));
    els.pullAll.addEventListener('click', () => requestPull(remainingForMe()));

    // ---------- 結果 ----------

    function winnerIds(sum) {
      const best = Math.max(...players.map((p) => sum[p.id].points));
      return players.filter((p) => sum[p.id].points === best).map((p) => p.id);
    }

    function rankedPlayers(sum) {
      return players.slice().sort((a, b) => sum[b.id].points - sum[a.id].points);
    }

    function showLeaderboard() {
      if (leaderboardShown) return;
      leaderboardShown = true;
      const sum = summarize(state.pulls);
      const winners = winnerIds(sum);
      els.leaderboard.innerHTML = rankedPlayers(sum).map((p, i) => {
        const isWinner = winners.includes(p.id);
        const medal = isWinner ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '　';
        return `<div class="result-row ${isWinner ? 'winner' : ''}">
          <span class="rank">${medal}</span>
          <span class="name">${nameHtml(p.id)}</span>
          <span class="dots">${countDots(sum[p.id].counts)}</span>
          <span class="points">${sum[p.id].points}pt</span>
        </div>`;
      }).join('');
      els.leaderboardPanel.classList.add('show');
      els.turnBanner.textContent = winners.length > 1 ? '引き分け！' : '';
      if (winners.length === 1) els.turnBanner.innerHTML = `🏆 ${nameHtml(winners[0])} の勝ち！`;
      els.finishBtn.hidden = isSpectator;
      els.finishHint.textContent = `押さなくても${AUTO_FINISH_MS / 1000}秒後に自動で終了します`;
      if (winners.includes(myPlayerId)) confetti(80);
      if (Hitsumabushi.isGameMaster()) autoFinishTimer = setTimeout(finishMatch, AUTO_FINISH_MS);
      if (els.gameCard.scrollTo) els.gameCard.scrollTo({ top: els.gameCard.scrollHeight, behavior: 'smooth' });
      if (finishRequested) finishMatch();
    }

    // 「終了」：結果をポータルに報告する（ポータルの結果ダイアログが出る）
    function finishMatch() {
      if (reported) return;
      if (!leaderboardShown) {
        // ホストの演出がまだ終わっていないときにゲストが押した。結果を出したらすぐに報告する
        if (Hitsumabushi.isGameMaster()) finishRequested = true;
        return;
      }
      if (Hitsumabushi.isGameMaster()) {
        clearTimeout(autoFinishTimer);
        autoFinishTimer = null;
        // 報告の前に最後の状態を配る（報告したあとは SDK が送信を止める）
        broadcastState();
        reported = true;
        reportGameOver();
      } else {
        Hitsumabushi.sendGameData({ type: 'FINISH' });
      }
      els.finishBtn.disabled = true;
      els.finishHint.textContent = '終了しています…';
    }

    function reportGameOver() {
      const sum = summarize(state.pulls);
      const scores = {};
      const counts = {};
      players.forEach((p) => {
        scores[p.id] = sum[p.id].points;
        counts[p.id] = sum[p.id].counts;
      });
      const rankings = rankedPlayers(sum).map((p) => p.id);
      const winners = winnerIds(sum);
      const stats = { counts };
      if (winners.length === 1) {
        Hitsumabushi.sendGameOver({ winnerPlayerId: winners[0], rankings, scores, stats });
      } else {
        Hitsumabushi.sendGameOver({ isTie: true, rankings, scores, stats });
      }
    }

    els.finishBtn.addEventListener('click', finishMatch);

    // ---------- SDK ----------

    function resetMatch() {
      matchToken++;
      skipNow();
      skipping = false;
      animating = false;
      shownCount = 0;
      receivedState = false;
      pendingPull = false;
      finishRequested = false;
      leaderboardShown = false;
      reported = false;
      [cpuTimer, turnTimer, autoFinishTimer, pendingTimer].forEach((t) => clearTimeout(t));
      cpuTimer = turnTimer = autoFinishTimer = pendingTimer = null;
      clearInterval(heartbeatTimer);
      heartbeatTimer = null;
      setRainbowBg(false);
      els.fxLayer.innerHTML = '';
      els.leaderboardPanel.classList.remove('show');
      els.leaderboard.innerHTML = '';
      els.finishBtn.hidden = true;
      els.finishBtn.disabled = false;
      els.finishHint.textContent = '';
      els.turnBanner.textContent = '';
      renderIdleStage();
    }

    Hitsumabushi.init({
      onStartMatch(config) {
        // ⚠️ onStartMatch はリマッチ時にも再度呼び出されるため、毎回内部状態を初期化する
        myPlayerId = config.localPlayerId;
        players = config.players || [];
        gameMasterId = config.gameMasterId || null;
        isSpectator = Hitsumabushi.isSpectator();
        document.body.classList.toggle('spectating', isSpectator);
        if (config.isObsMode) document.body.classList.add('transparent');

        resetMatch();
        state = null;
        if (Hitsumabushi.isGameMaster()) {
          // 引く順番は参加者の並び順
          state = { order: players.map((p) => p.id), pulls: [] };
          broadcastState();
          startHeartbeat();
          onIdle();
        } else {
          renderBoard();
          updateControls();
        }
      },
      onObsModeChange(isObs) {
        document.body.classList.toggle('transparent', isObs);
      },
      onGameData(payload, senderId) {
        if (!payload || typeof payload !== 'object') return;
        if (payload.type === 'STATE') {
          handleState(payload.state, senderId);
        } else if (payload.type === 'PULL') {
          if (Hitsumabushi.isGameMaster() && players.some((p) => p.id === senderId && !p.isCpu)) {
            hostPull(senderId, Number(payload.count), false);
          }
        } else if (payload.type === 'FINISH') {
          // ゲストが「終了」を押した。結果を報告できるのはホストだけなので代わりに報告する
          if (Hitsumabushi.isGameMaster() && players.some((p) => p.id === senderId && !p.isCpu)) finishMatch();
        }
      },
    });

    function isValidState(st) {
      return st && Array.isArray(st.order) && Array.isArray(st.pulls)
        && st.pulls.every((pl) => pl && Number.isInteger(pl.p) && pl.p >= 0 && pl.p < st.order.length && typeof pl.r === 'string' && /^[0-4]+$/.test(pl.r));
    }

    // ホストから届いた状態を受け取り、まだ見ていない結果の演出を再生する
    function handleState(st, senderId) {
      if (Hitsumabushi.isGameMaster() || senderId !== gameMasterId || players.length === 0) return;
      if (!isValidState(st)) return;
      if (state && st.pulls.length < state.pulls.length) return;
      // 途中から入った人（観戦者・再接続）は、最後の1回だけ演出を見る
      if (!receivedState && st.pulls.length > 1) shownCount = st.pulls.length - 1;
      receivedState = true;
      const changed = !state || st.pulls.length !== state.pulls.length;
      state = st;
      if (changed) {
        pendingPull = false;
        clearTimeout(pendingTimer);
      }
      if (shownCount < state.pulls.length) {
        pump();
      } else if (!animating) {
        onIdle();
      }
    }

    renderRates();
    renderSoundBtn();
    renderIdleStage();
  </script>
</body>
</html>
