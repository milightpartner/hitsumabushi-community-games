<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>消えるネオン三目並べ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body { overscroll-behavior: none; }
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background-color: #0a0b10;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* 高さはポータルが決める。min-height だと中身に押し広げられ、はみ出す（#295） */
      height: 100vh;
      height: 100dvh;
      padding: 8px;
      overflow: hidden;
      transition: background-color 0.3s;
    }
    body.transparent {
      background-color: transparent !important;
    }

    .game-card {
      background: rgba(22, 26, 42, 0.88);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(57, 255, 20, 0.35);
      border-radius: 24px;
      padding: 24px 32px;
      box-shadow: 0 0 35px rgba(57, 255, 20, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 390px;
      max-width: 100%;
      /* 高さを固定しない。盤面を伸縮させるにはカード自身が縮む必要がある（#295） */
      height: 100%;
      position: relative;
    }

    .players-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 12px;
    }
    .player-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid transparent;
      transition: all 0.3s ease;
      /* 固定の min-width は狭い画面でカードからはみ出す。縮ませて名前側で省略する（#295） */
      flex: 1 1 0;
      min-width: 0;
    }
    .player-box.active-p1 {
      border-color: #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      background: rgba(0, 240, 255, 0.1);
    }
    .player-box.active-p2 {
      border-color: #ff007f;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
      background: rgba(255, 0, 127, 0.1);
    }
    .player-name {
      font-size: 0.85rem;
      font-weight: 700;
      color: #94a3b8;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-symbol {
      font-size: 1.3rem;
      font-weight: 900;
      margin-top: 2px;
    }
    .p1-symbol {
      color: #00f0ff;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
    }
    .p2-symbol {
      color: #ff007f;
      text-shadow: 0 0 10px rgba(255, 0, 127, 0.8);
    }
    .piece-count {
      font-size: 0.72rem;
      color: #64748b;
      margin-top: 2px;
    }

    .vs-text {
      font-size: 0.9rem;
      font-weight: 900;
      color: #64748b;
    }

    .status-badge {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 8px;
      padding: 4px 16px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.07);
      letter-spacing: 0.5px;
    }

    .rule-pill {
      font-size: 0.75rem;
      color: #39ff14;
      background: rgba(57, 255, 20, 0.12);
      border: 1px solid rgba(57, 255, 20, 0.3);
      padding: 2px 10px;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .timer-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 18px;
    }
    .timer-bar {
      height: 100%;
      width: 100%;
      background: #39ff14;
      box-shadow: 0 0 10px #39ff14;
      transition: width 0.1s linear, background-color 0.3s;
    }

    .board-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 12px;
      /* 実寸は fitBoard() が ResizeObserver で測って入れる（#295） */
      position: relative;
      touch-action: manipulation;
    }

    /* 盤面の入れ物。高さは flex が決める。min-height: 0 が無いと縮まずはみ出す */
    .board-wrap {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cell {
      background: rgba(30, 36, 60, 0.7);
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.2rem;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }
    .cell:hover:not(.filled) {
      background: rgba(57, 255, 20, 0.12);
      border-color: rgba(57, 255, 20, 0.5);
      transform: scale(1.03);
    }
    .cell.filled {
      cursor: default;
    }
    .cell.filled.p1-mark {
      color: #00f0ff;
      border-color: rgba(0, 240, 255, 0.5);
      text-shadow: 0 0 20px rgba(0, 240, 255, 0.8);
      animation: popIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .cell.filled.p2-mark {
      color: #ff007f;
      border-color: rgba(255, 0, 127, 0.5);
      text-shadow: 0 0 20px rgba(255, 0, 127, 0.8);
      animation: popIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* 次に消滅するコマのパルス点滅 */
    @keyframes pulseFade {
      0% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.92); border-color: rgba(255, 255, 255, 0.2); }
      100% { opacity: 0.9; transform: scale(1); }
    }
    .cell.vanishing-warning {
      animation: pulseFade 1.2s infinite ease-in-out !important;
      border-style: dashed !important;
    }
    .cell.vanishing-warning::after {
      content: "NEXT OUT";
      position: absolute;
      bottom: 6px;
      font-size: 0.55rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: rgba(0, 0, 0, 0.6);
      padding: 1px 4px;
      border-radius: 4px;
      color: #ffd700;
    }

    .cell.winning-cell {
      background: rgba(57, 255, 20, 0.25) !important;
      border-color: #39ff14 !important;
      box-shadow: 0 0 25px rgba(57, 255, 20, 0.7);
      transform: scale(1.06);
    }

    @keyframes popIn {
      0% { transform: scale(0.3); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .footer-info {
      margin-top: 16px;
      font-size: 0.75rem;
      color: #64748b;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="game-card">
    <div class="players-bar">
      <div class="player-box active-p1" id="p1Box">
        <span class="player-name" id="p1Name">Player 1</span>
        <span class="player-symbol p1-symbol">○</span>
        <span class="piece-count" id="p1Count">コマ: 0/3</span>
      </div>
      <span class="vs-text">VS</span>
      <div class="player-box" id="p2Box">
        <span class="player-name" id="p2Name">Player 2</span>
        <span class="player-symbol p2-symbol">×</span>
        <span class="piece-count" id="p2Count">コマ: 0/3</span>
      </div>
    </div>

    <div class="status-badge" id="statusBadge">先攻 (○) の手番</div>
    <div class="rule-pill">⚠️ 4つ目を置くと最古のコマが消滅！</div>

    <div class="timer-container">
      <div class="timer-bar" id="timerBar"></div>
    </div>

    <div class="board-wrap" id="boardWrap">

    <div class="board-grid" id="boardGrid">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>
  </div>

    <div class="footer-info">引き分けなし / 循環するエンドレス頭脳戦</div>
  </div>

  <script src="https://milightpartner.jp/sdk/0.20.0/hitsumabushi-sdk.js"></script>
  <script>
    var board = [null, null, null, null, null, null, null, null, null];
    // 各プレイヤーの配置履歴 (FIFOキュー: 最大3要素)
    var moveHistory = { p1: [], p2: [] };

    var currentTurn = 'p1';
    var localPlayerId = null;
    var isSpectator = false;
    var isGameOver = false;
    var timerInterval = null;
    var timeLeftMs = 10000;
    var TURN_DURATION_MS = 10000;

    var WIN_LINES = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    var boardGrid = document.getElementById('boardGrid');
    // === 盤面の実測フィット（Issue #295 / ガイドライン §2・§3） ===
    // CSSだけでは安定しない。aspect-ratio は flex コンテナ内で幅基準に解決されるため
    // 縦が足りない画面ではみ出し、vh/dvh は iOS SafariのURLバー伸縮で変動する。
    // 親を実測して px で入れるのが確実。
    var BOARD_SIZE = 3;
    var boardWrapEl = document.getElementById('boardWrap');
    var boardGridEl = document.getElementById('boardGrid');

    function fitBoard() {
      var side = Math.min(boardWrapEl.clientWidth, boardWrapEl.clientHeight);
      // 非表示中や初期化前は 0 になる。抜けないと盤面が幅0のまま戻らなくなる
      if (side <= 0) return;
      // セル1辺を整数pxに揃える（罫線のにじみと1px単位のガタつきを防ぐ）
      var snapped = Math.floor(side / BOARD_SIZE) * BOARD_SIZE;
      boardGridEl.style.width = snapped + 'px';
      boardGridEl.style.height = snapped + 'px';
    }

    if (typeof ResizeObserver === 'function') {
      new ResizeObserver(fitBoard).observe(boardWrapEl);
    }
    window.addEventListener('resize', fitBoard);
    fitBoard();

    var cells = document.querySelectorAll('.cell');
    var statusBadge = document.getElementById('statusBadge');
    var timerBar = document.getElementById('timerBar');
    var p1Box = document.getElementById('p1Box');
    var p2Box = document.getElementById('p2Box');
    var p1Name = document.getElementById('p1Name');
    var p2Name = document.getElementById('p2Name');
    var p1Count = document.getElementById('p1Count');
    var p2Count = document.getElementById('p2Count');

    // 1. SDK 初期化
    Hitsumabushi.init({
      onStartMatch: function (config) {
        // ステートとDOMの完全リセット (Issue #78 / SDK spec)
        board = [null, null, null, null, null, null, null, null, null];
        moveHistory = { p1: [], p2: [] };
        currentTurn = 'p1';
        isGameOver = false;
        clearInterval(timerInterval);

        cells.forEach(function (cell) {
          cell.className = 'cell';
          cell.textContent = '';
        });

        localPlayerId = config.localPlayerId || null;
        isSpectator = Hitsumabushi.isSpectator();

        // 観戦時は盤面タップを物理ロック
        if (boardGrid) {
          boardGrid.style.pointerEvents = isSpectator ? 'none' : 'auto';
        }

        var p1 = config.players && config.players.find(function(p) { return p.id === 'p1'; });
        var p2 = config.players && config.players.find(function(p) { return p.id === 'p2'; });

        if (p1) p1Name.textContent = p1.name || 'Player 1';
        if (p2) p2Name.textContent = p2.name || 'Player 2';

        if (config.isObsMode) {
          document.body.classList.add('transparent');
        }

        updateUI();
        startTurnTimer();
      },

      onObsModeChange: function (isObs) {
        document.body.classList.toggle('transparent', isObs);
      },

      onGameData: function (payload) {
        if (isGameOver) return;
        if (payload.type === 'MOVE') {
          handleMove(payload.index, payload.playerId);
        } else if (payload.type === 'TIMEOUT_LOSS') {
          handleTimeoutLoss(payload.loserId);
        }
      }
    });

    // 2. セルクリック
    cells.forEach(function (cell) {
      cell.addEventListener('click', function () {
        if (isGameOver || isSpectator) return;
        if (currentTurn !== localPlayerId) return;

        var index = parseInt(cell.getAttribute('data-index'), 10);
        if (board[index] !== null) return; // 既に埋まっているマス

        // 送信 & 着手
        Hitsumabushi.sendGameData({
          type: 'MOVE',
          index: index,
          playerId: localPlayerId
        });

        handleMove(index, localPlayerId);
      });
    });

    // 3. 着手処理 (最古のコマ消滅ロジック)
    function handleMove(index, playerId) {
      if (board[index] !== null || isGameOver) return;

      var history = moveHistory[playerId];

      // すでに3つ置かれている場合、一番古いコマを消去
      if (history.length >= 3) {
        var oldestIndex = history.shift();
        board[oldestIndex] = null;
        var oldCell = cells[oldestIndex];
        oldCell.classList.remove('filled', 'p1-mark', 'p2-mark', 'vanishing-warning');
        oldCell.textContent = '';
      }

      // 新しい手を記録
      history.push(index);
      board[index] = playerId;

      var cell = cells[index];
      cell.classList.add('filled');
      if (playerId === 'p1') {
        cell.classList.add('p1-mark');
        cell.textContent = '○';
      } else {
        cell.classList.add('p2-mark');
        cell.textContent = '×';
      }

      // 勝敗チェック
      var winResult = checkWinner();
      if (winResult) {
        endGame(winResult.winner, winResult.line);
        return;
      }

      // ターン交代
      currentTurn = (currentTurn === 'p1') ? 'p2' : 'p1';
      updateUI();
      startTurnTimer();
    }

    function checkWinner() {
      for (var i = 0; i < WIN_LINES.length; i++) {
        var line = WIN_LINES[i];
        var a = board[line[0]];
        var b = board[line[1]];
        var c = board[line[2]];
        if (a && a === b && a === c) {
          return { winner: a, line: line };
        }
      }
      return null;
    }

    function endGame(winner, winningLine) {
      isGameOver = true;
      clearInterval(timerInterval);
      timerBar.style.width = '0%';

      // 警告演出クリア
      cells.forEach(function(c) { c.classList.remove('vanishing-warning'); });

      p1Box.classList.remove('active-p1');
      p2Box.classList.remove('active-p2');

      winningLine.forEach(function (idx) {
        cells[idx].classList.add('winning-cell');
      });

      var winnerName = (winner === 'p1') ? p1Name.textContent : p2Name.textContent;
      var mark = (winner === 'p1') ? '○' : '×';
      statusBadge.textContent = '🎉 ' + winnerName + ' (' + mark + ') の勝利！';
      statusBadge.style.color = (winner === 'p1') ? '#00f0ff' : '#ff007f';

      if (!isSpectator) {
        var scores = { p1: winner === 'p1' ? 1 : 0, p2: winner === 'p2' ? 1 : 0 };
        Hitsumabushi.sendScoreUpdate(scores);
        Hitsumabushi.sendGameOver({
          winnerPlayerId: winner,
          rankings: winner === 'p1' ? ['p1', 'p2'] : ['p2', 'p1'],
          isTie: false,
          scores: scores
        });
      }
    }

    function updateUI() {
      p1Count.textContent = 'コマ: ' + moveHistory.p1.length + '/3';
      p2Count.textContent = 'コマ: ' + moveHistory.p2.length + '/3';

      // 前の警告スタイルをリセット
      cells.forEach(function(c) { c.classList.remove('vanishing-warning'); });

      if (isSpectator) {
        var activeName = (currentTurn === 'p1') ? p1Name.textContent : p2Name.textContent;
        var activeMark = (currentTurn === 'p1') ? '○' : '×';
        statusBadge.textContent = '👀 観戦中: ' + activeName + ' の手番 (' + activeMark + ')';
        statusBadge.style.color = (currentTurn === 'p1') ? '#00f0ff' : '#ff007f';
        if (currentTurn === 'p1') {
          p1Box.classList.add('active-p1');
          p2Box.classList.remove('active-p2');
        } else {
          p1Box.classList.remove('active-p1');
          p2Box.classList.add('active-p2');
        }
      } else if (currentTurn === 'p1') {
        p1Box.classList.add('active-p1');
        p2Box.classList.remove('active-p2');
        if (localPlayerId === 'p1') {
          statusBadge.textContent = 'あなたの手番です (○)';
          statusBadge.style.color = '#00f0ff';
        } else {
          statusBadge.textContent = p1Name.textContent + ' の思考中... (○)';
          statusBadge.style.color = '#94a3b8';
        }
      } else {
        p1Box.classList.remove('active-p1');
        p2Box.classList.add('active-p2');
        if (localPlayerId === 'p2') {
          statusBadge.textContent = 'あなたの手番です (×)';
          statusBadge.style.color = '#ff007f';
        } else {
          statusBadge.textContent = p2Name.textContent + ' の思考中... (×)';
          statusBadge.style.color = '#94a3b8';
        }
      }

      // 手番のプレイヤーがすでに3つ置いている場合、最古のコマを点滅
      var currentHistory = moveHistory[currentTurn];
      if (currentHistory.length >= 3) {
        var oldestIdx = currentHistory[0];
        cells[oldestIdx].classList.add('vanishing-warning');
      }
    }

    function startTurnTimer() {
      clearInterval(timerInterval);
      timeLeftMs = TURN_DURATION_MS;
      timerBar.style.width = '100%';
      timerBar.style.backgroundColor = (currentTurn === 'p1') ? '#00f0ff' : '#ff007f';
      timerBar.style.boxShadow = '0 0 10px ' + ((currentTurn === 'p1') ? '#00f0ff' : '#ff007f');

      var stepMs = 100;
      timerInterval = setInterval(function () {
        timeLeftMs -= stepMs;
        var pct = Math.max(0, (timeLeftMs / TURN_DURATION_MS) * 100);
        timerBar.style.width = pct + '%';

        if (timeLeftMs <= 3000) {
          timerBar.style.backgroundColor = '#ff0055';
          timerBar.style.boxShadow = '0 0 12px #ff0055';
        }

        // 時間切れ判定 (Issue #79) - 観戦者は判定を行わない
        if (timeLeftMs <= 0 && !isSpectator) {
          if (!isGameOver && currentTurn === localPlayerId) {
            // 自分のターンで時間切れ → 自分の時間切れ負け
            clearInterval(timerInterval);
            var opponent = (localPlayerId === 'p1') ? 'p2' : 'p1';
            endGameByTimeout(opponent, localPlayerId, true);
          } else if (!isGameOver && timeLeftMs <= -2000) {
            // 相手ターンで時間切れ後2秒経過しても着手が来ない → 相手のタイムアウト負けとして待機側が判定
            clearInterval(timerInterval);
            endGameByTimeout(localPlayerId, currentTurn, false);
          }
        }
      }, stepMs);
    }

    // タイムアウト決着処理 (Issue #79)
    function endGameByTimeout(winner, loser, isSelfClaimed) {
      if (isGameOver) return;
      isGameOver = true;
      clearInterval(timerInterval);
      timerBar.style.width = '0%';

      p1Box.classList.remove('active-p1');
      p2Box.classList.remove('active-p2');

      var winnerName = (winner === 'p1') ? p1Name.textContent : p2Name.textContent;
      statusBadge.textContent = '⏰ 時間切れ！ ' + winnerName + ' の勝利！';
      statusBadge.style.color = (winner === 'p1') ? '#00f0ff' : '#ff007f';

      if (!isSpectator) {
        if (isSelfClaimed) {
          Hitsumabushi.sendGameData({
            type: 'TIMEOUT_LOSS',
            loserId: loser
          });
        }

        var scores = { p1: winner === 'p1' ? 1 : 0, p2: winner === 'p2' ? 1 : 0 };
        Hitsumabushi.sendScoreUpdate(scores);
        Hitsumabushi.sendGameOver({
          winnerPlayerId: winner,
          rankings: winner === 'p1' ? ['p1', 'p2'] : ['p2', 'p1'],
          isTie: false,
          scores: scores,
          reason: 'timeout'
        });
      }
    }

    function handleTimeoutLoss(loserId) {
      var winner = (loserId === 'p1') ? 'p2' : 'p1';
      endGameByTimeout(winner, loserId, false);
    }
  </script>
</body>
</html>
