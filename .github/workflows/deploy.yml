name: Deploy

# Firebase deploys need a service account secret, which GitHub never exposes to a PR built
# from a fork (see pr-validate.yml for the fork-safe validation check that runs regardless).
# So: preview channels only happen for PRs from branches within this repo itself (trusted
# collaborators); a fork contributor tests locally via `npx hitsumabushi dev` instead, and
# their game only actually reaches Firebase once a maintainer merges the PR to main.
#
# firebase.json configures two sites, and every deploy below updates both: the games site
# (games/ as-is) and the game guide site guide.milightpartner.jp (dist-guides/, built from
# games/*/guide.md by the portal's shared SSG engine hitsudoc - see .github/actions/build-guides).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  # Manual cleanup of preview channels left behind by closed PRs (see cleanup_preview_channels).
  workflow_dispatch:

permissions:
  contents: read
  # Installing @milightpartner/hitsudoc from GitHub Packages (.github/actions/build-guides).
  packages: read
  pull-requests: write
  # action-hosting-deploy reports its own progress via a custom Check Run (POST
  # /check-runs), which needs `checks: write` specifically - confirmed from the actual
  # 403 response's `x-accepted-github-permissions: checks=write` header. pull-requests:
  # write alone fails with "Resource not accessible by integration".
  checks: write

jobs:
  preview:
    name: Deploy Preview Channel
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-guides
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_HITU_MABUSI }}'
          projectId: hitu-mabusi
          expires: 7d

  preview_skipped_notice:
    name: Note Preview Skipped (fork PR)
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "外部フォークからのPRのため、Firebase Previewチャンネルは発行されません。"
          echo "npx hitsumabushi dev でローカルに動作確認してください。マージ後、本番サイトに反映されます。"

  # Deletes the closed PR's preview channels on both sites. (This used to run action-hosting-deploy
  # again, which deploys a preview rather than deleting one, so channels only went away on expiry
  # and a busy week of PRs filled the sites' channel quota.) Run manually, it deletes the channels
  # of every PR that is no longer open.
  cleanup_preview_channels:
    name: Delete Preview Channels of Closed PRs
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_HITU_MABUSI }}'
      - run: bash scripts/cleanup-preview-channels.sh ${{ github.event.pull_request.number }}
        env:
          GH_TOKEN: ${{ github.token }}

  deploy_live:
    name: Deploy to Live
    if: github.event_name == 'push'
    # Each deploy replaces the whole site with that commit's tree, so two live deploys running at
    # once (e.g. several PRs merged back to back) could finish out of order and leave an older
    # tree live. Run them one at a time; a queued run is superseded by a newer one, which is fine
    # because the newer commit contains everything the older one did.
    concurrency:
      group: deploy-live
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-guides
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_HITU_MABUSI }}'
          channelId: live
          projectId: hitu-mabusi
